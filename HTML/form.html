<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
</head>

<body>
    <form action="https://www.google.com/search" method="get">
        <center>
            <table>
                <tr>
                    <td><label for="name ">Name:</label></td>
                    <td>
                        <input type="text" id="name " name="name" required value="YASH MAHENDRBHAI RATHOD" />
                    </td>
                </tr>
                <tr>
                    <td></td><label for="mail">Email:</label></td>
                    <td>
                        <input type="email" id="mail" name="mail" required value="yashrathod@example.com" />
                    </td>
                </tr>
                <tr>
                    <td><label for="gender">Gender:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male" required checked />
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female" required />
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="country">Country:</label></td>
                    <td>
                        <select id="country" name="country" required>
                            <option value="">Select a country</option>
                            <option value="india" selected>India</option>
                            <option value="usa">USA</option>
                            <option value="uk">UK</option>
                            <option value="canada">Canada</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="message">Message:</label></td>
                    <td>
                        <textarea id="message" name="message" rows="4" cols="50" required>Hi, I am Yash Rathod. I am a web developer and I love to learn new things.</textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Submit" />
                    </td>
                </tr>

            </table>
        </center>
    </form>
</body>

</html>
